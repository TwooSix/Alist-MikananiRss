name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: CI / Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Check lockfile
        run: uv lock --check

      - name: Run Ruff
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen black --check .

  test:
    name: CI / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Run tests
        run: uv run --frozen pytest -q

  windows-compatibility:
    name: CI / Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Verify libtorrent without third-party DLL directories
        shell: pwsh
        run: |
          $python = (Resolve-Path ".venv\Scripts\python.exe").Path
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & $python -c "import libtorrent as lt; assert lt.torrent_info(b'd4:infod6:lengthi123e4:name13:Show - 01.mkv12:piece lengthi16384e6:pieces20:aaaaaaaaaaaaaaaaaaaaee').name() == 'Show - 01.mkv'; print(lt.__version__)"

      - name: Verify native torrent runtime and resolver
        run: >-
          uv run --frozen --python ${{ matrix.python-version }} pytest -q
          tests/adapters/torrent/test_torrent_resolver.py

      - name: Run full Windows test suite
        if: matrix.python-version == '3.13'
        run: uv run --frozen --python ${{ matrix.python-version }} pytest -q

  build:
    name: CI / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Build package
        run: uv build --out-dir dist

      - name: Build Docker image
        run: docker build --file docker/Dockerfile --tag openlist-ani:ci .
